name: Game compatibility report
description: Report how an Xbox Series X|S game runs in TrinityXSX (crash, black screen, graphics, audio, controller, or playable).
title: "[Game] "
labels: ["game-compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing your game with **TrinityXSX**!
        Please collect your logs first (`python tools/collect_ps5_logs.py <PS5-IP>`) or grab `xcl.log` and `session-N.log` via FTP.
        **Never upload game files, `.exe`/`.dll` binaries, keys, or copyrighted assets.**

  - type: input
    id: release
    attributes:
      label: TrinityXSX release version
      placeholder: v0.1.0 (01.000.015)
    validations:
      required: true

  - type: dropdown
    id: install_mode
    attributes:
      label: Installation mode
      options:
        - Standalone PS5 tile (PPSA83601.ffpkg)
        - prospero-win profile
        - Windows PC test (vkd3d-proton / native D3D12)
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: PS5 firmware & homebrew setup
      placeholder: e.g. FW 7.61 / 10.01, etaHEN, ShadowMountPlus, kstuff
    validations:
      required: true

  - type: input
    id: game
    attributes:
      label: Game name, Identity Name, Version, and TitleId
      description: Found inside the game's MicrosoftGame.config (Identity Name / Version / TitleId).
      placeholder: e.g. Example Game — Publisher.ExampleGame 1.2.3.0 (TitleId 1234ABCD)
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Current state
      options:
        - Does not appear in the library
        - Crashes on launch / returns to PS5 home screen
        - Black screen or freezes during loading
        - Menus work, crashes or hangs entering gameplay
        - In-game with graphics / audio / controller issues
        - Playable
    validations:
      required: true

  - type: input
    id: storage
    attributes:
      label: Game folder path on PS5
      placeholder: e.g. /mnt/ext1/xboxseries/MyGame or /mnt/usb0/xboxseries/MyGame
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: xcl.toml settings used
      description: Paste your xcl.toml (or write "Default auto-generated xcl.toml").
      placeholder: |
        device_type = "lockhart"
        title_memory_mb = 6144
        coherent_mb = 1024
        direct_dxil = "all"
        network = false

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce & observed behavior
      description: Describe exactly what happens (e.g. splash screen appears, hangs after pressing Play, controller does not respond, etc.).
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or video
      description: |
        Attach the ZIP generated by `tools/collect_ps5_logs.py`, or attach:
        - `/data/homebrew/PPSA83601/prefix/drive_c/users/prospero/AppData/Local/XCL/<Title>/logs/xcl.log`
        - `/data/homebrew/PPSA83601/logs/session-N.log`
        - `/data/homebrew/PPSA83601/prefix/drive_c/XCL/vkd3d-trinityxsx-library.log`
        - `/data/homebrew/PPSA83601/startup.log`
        **Do NOT upload any game files.**
    validations:
      required: true
