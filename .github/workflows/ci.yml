# Auxiliary CI: checks that the patches apply to the pinned upstreams and build, runs XCL's
# test suite on a Windows runner (no GPU: GPU tests print SKIPPED and pass), builds the patched
# vkd3d-proton with MSYS2's MinGW, verifies standalone tooling and prospero-win patches, and
# uploads the PS5 package + standalone xcl-library.exe as artifacts.
name: CI

on:
  push:
    branches: [main]
    paths:
      - pins.env
      - patches/**
      - library/**
      - sce_sys/**
      - standalone/**
      - tools/setup-sources.sh
      - tools/fetch-deps.sh
      - tools/make-ps5-package.sh
      - tools/build-standalone-ffpkg.sh
      - tools/build-innoextract.sh
      - tools/innoextract/**
      - tools/netinput-sender/**
      - tools/sync_upstream.py
      - tools/compat.py
      - tools/test_compat.py
      - tools/ps5_bench.py
      - tools/test_ps5_bench.py
      - docs/COMPATIBILITY.md
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - pins.env
      - patches/**
      - library/**
      - sce_sys/**
      - standalone/**
      - tools/setup-sources.sh
      - tools/fetch-deps.sh
      - tools/make-ps5-package.sh
      - tools/build-standalone-ffpkg.sh
      - tools/build-innoextract.sh
      - tools/innoextract/**
      - tools/netinput-sender/**
      - tools/sync_upstream.py
      - tools/compat.py
      - tools/test_compat.py
      - tools/ps5_bench.py
      - tools/test_ps5_bench.py
      - docs/COMPATIBILITY.md
      - .github/workflows/ci.yml
  workflow_dispatch:
    inputs:
      build_ffpkg:
        description: 'Also build and verify full standalone PPSA83601.ffpkg'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone:
    name: Standalone tests & prospero-win patches
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Run standalone unit tests
        run: python3 -m unittest standalone.test_standalone -v

      - name: Compatibility database (library/compat.toml), its table, and the benchmark tool
        run: |
          python3 -m unittest tools.test_compat -v
          python3 -m unittest tools.test_ps5_bench -v
          python3 tools/compat.py --check

      - name: Verify sce_sys ProsperoStore metadata
        run: |
          python3 - <<'PY'
          import json, re, struct
          from pathlib import Path
          param = json.loads(Path("sce_sys/param.json").read_text(encoding="utf-8-sig"))
          assert param.get("titleId") == "PPSA83601", f"unexpected titleId: {param.get('titleId')}"
          cv = param.get("contentVersion", "")
          assert re.fullmatch(r"\d{2}\.\d{3}\.\d{3}", cv), f"invalid contentVersion: {cv!r}"
          png = Path("sce_sys/icon0.png").read_bytes()
          assert png.startswith(b"\x89PNG\r\n\x1a\n"), "sce_sys/icon0.png is not a PNG"
          w, h = struct.unpack(">II", png[16:24])
          assert (w, h) == (512, 512), f"expected 512x512 icon0.png, got {w}x{h}"
          print(f"sce_sys OK: titleId={param['titleId']} contentVersion={cv} icon0={w}x{h}")
          PY

      - name: Syntax-check tools/sync_upstream.py & standalone build scripts
        run: |
          python3 -m py_compile tools/sync_upstream.py standalone/native/build_launcher.py standalone/native/build_prefix_seed.py
          bash -n tools/build-standalone-ffpkg.sh
          bash -n tools/setup-sources.sh

      # library/ is TrinityXSX's own code, formatted with library/rustfmt.toml. XCL's own tree is
      # not rustfmt-clean (see its CONTRIBUTING.md), so only library/ is checked.
      - name: rustfmt library/
        run: |
          rustup component add rustfmt
          rustfmt --version
          rustfmt --check library/*.rs

      - name: Verify patches/prospero-win apply cleanly to pinned prospero-win
        run: |
          set -euo pipefail
          . ./pins.env
          tmp=$(mktemp -d)
          git init -q "$tmp/pw"
          git -C "$tmp/pw" fetch -q --depth 1 "$PROSPERO_WIN_REPO" "$PROSPERO_WIN_REV"
          git -C "$tmp/pw" checkout -q FETCH_HEAD
          for p in patches/prospero-win/*.patch; do
            echo "Applying $p"
            git -C "$tmp/pw" apply --whitespace=nowarn "$PWD/$p"
          done
          rm -rf "$tmp"

  xcl:
    name: XCL (Windows, no GPU)
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - name: Keep line endings as they are (the patches apply byte for byte)
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - name: Outputs of these inputs, if built before
        id: out
        uses: actions/cache@v6
        with:
          path: out
          key: xcl-out-v3-${{ hashFiles('pins.env', 'tools/setup-sources.sh', 'patches/xcl/**', 'library/**') }}

      - name: Fetch XCL and apply patches/xcl
        if: steps.out.outputs.cache-hit != 'true'
        shell: bash
        run: tools/setup-sources.sh --only xcl

      - name: Rust (stable, MSVC)
        if: steps.out.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2
        if: steps.out.outputs.cache-hit != 'true'
        with:
          workspaces: xcl -> target

      - name: Build (release)
        if: steps.out.outputs.cache-hit != 'true'
        working-directory: xcl
        run: cargo build --workspace --release

      - name: Test (release build, GPU tests skip)
        if: steps.out.outputs.cache-hit != 'true'
        working-directory: xcl
        run: cargo test --workspace --release -- --test-threads=4 --skip test_title_runs_

      # library/ is TrinityXSX's own code: no clippy findings there. XCL's own tree has many (and
      # a few deny-by-default ones), so lints are capped to warnings and only library/ is gated.
      - name: Clippy (library/ only)
        if: steps.out.outputs.cache-hit != 'true'
        working-directory: xcl
        shell: bash
        run: |
          rustup component add clippy
          cargo clippy -p xcl --release --all-targets --message-format=short -- --cap-lints warn 2>&1 | tee ../clippy.txt
          if grep -E 'library[\\/]library[a-z_]*\.rs:[0-9]+:[0-9]+: (warning|error)' ../clippy.txt; then
            echo "::error::clippy found the problems above in library/"
            exit 1
          fi

      - name: Collect outputs
        if: steps.out.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p out/xcl/target/release out/xcl/tests/data
          cp xcl/target/release/{xcl.exe,xcl_testtitle.exe,testgame_mw.dll} out/xcl/target/release/
          cp -r xcl/tests/data/testgame out/xcl/tests/data/
          cp xcl/LICENSE out/xcl/

      - uses: actions/upload-artifact@v7
        with:
          name: xcl-release
          path: out/
          if-no-files-found: error

  vkd3d-proton:
    name: vkd3d-proton (MSYS2 UCRT64)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Keep line endings as they are (the patches apply byte for byte)
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - name: Outputs of these inputs, if built before
        id: out
        uses: actions/cache@v6
        with:
          path: out
          key: vkd3d-out-v2-${{ hashFiles('pins.env', 'tools/setup-sources.sh', 'patches/vkd3d-proton/**', 'patches/dxil-spirv/**') }}

      - name: Toolchain (MSYS2 UCRT64)
        if: steps.out.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          cache: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-glslang
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-tools

      - name: Fetch vkd3d-proton and apply patches/vkd3d-proton, patches/dxil-spirv
        if: steps.out.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: tools/setup-sources.sh --only vkd3d

      - name: Build (release, asserts off)
        if: steps.out.outputs.cache-hit != 'true'
        shell: msys2 {0}
        working-directory: vkd3d-proton
        run: |
          gcc --version | head -1
          meson setup build-ndebug --buildtype release -Db_ndebug=true --strip
          ninja -C build-ndebug

      - name: Collect outputs
        if: steps.out.outputs.cache-hit != 'true'
        shell: bash
        run: |
          v=out/vkd3d-proton
          mkdir -p $v/build-ndebug/libs/d3d12 $v/build-ndebug/libs/d3d12core $v/subprojects/dxil-spirv
          cp vkd3d-proton/build-ndebug/libs/d3d12/d3d12.dll $v/build-ndebug/libs/d3d12/
          cp vkd3d-proton/build-ndebug/libs/d3d12core/d3d12core.dll $v/build-ndebug/libs/d3d12core/
          cp vkd3d-proton/LICENSE vkd3d-proton/COPYING $v/
          cp vkd3d-proton/subprojects/dxil-spirv/LICENSE.MIT $v/subprojects/dxil-spirv/

      - uses: actions/upload-artifact@v7
        with:
          name: vkd3d-proton
          path: out/
          if-no-files-found: error

  innoextract:
    name: trinity_innoextract.dll (MSYS2 UCRT64)
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7

      - name: Restore cached innoextract output
        id: out
        uses: actions/cache@v6
        with:
          path: out/innoextract
          key: innoextract-out-v1-${{ hashFiles('pins.env', 'tools/build-innoextract.sh', 'tools/innoextract/**') }}

      - name: Toolchain (MSYS2 UCRT64)
        if: steps.out.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          cache: true
          install: >-
            git
            python
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-xz

      - name: Build static trinity_innoextract.dll
        if: steps.out.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash tools/build-innoextract.sh

      - uses: actions/upload-artifact@v7
        with:
          name: innoextract
          path: out/innoextract
          if-no-files-found: error

  netinput-sender:
    name: txin-sender.exe (keyboard & mouse over the LAN)
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - name: Rust (stable, MSVC)
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Check, test & build
        working-directory: tools/netinput-sender
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo build --release

      - uses: actions/upload-artifact@v7
        with:
          name: txin-sender
          path: tools/netinput-sender/target/release/txin-sender.exe
          if-no-files-found: error

  package:
    name: PS5 package (prospero-win & xcl-library)
    needs: [xcl, vkd3d-proton, innoextract, standalone]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            tools/dxvk
            tools/dxc
          key: deps-${{ hashFiles('pins.env') }}

      - name: DXVK and DXC (checksums verified)
        run: tools/fetch-deps.sh

      - uses: actions/download-artifact@v8
        with:
          name: xcl-release

      - uses: actions/download-artifact@v8
        with:
          name: innoextract
          path: innoextract

      - uses: actions/download-artifact@v8
        with:
          name: vkd3d-proton

      - name: Assemble
        run: |
          tools/make-ps5-package.sh
          mkdir -p dist/release-bundle
          cp xcl/target/release/xcl.exe dist/release-bundle/xcl-library.exe
          (cd dist/prospero-win && zip -qr ../release-bundle/TrinityXSX-prospero-win.zip .)
          (cd dist/release-bundle && sha256sum xcl-library.exe TrinityXSX-prospero-win.zip > SHA256SUMS.txt)
          cat dist/release-bundle/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: xcl-prospero-win
          path: dist/prospero-win
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: trinityxsx-release-bundle
          path: dist/release-bundle
          if-no-files-found: error

  standalone-ffpkg:
    name: Standalone PPSA83601.ffpkg (optional / dispatch)
    if: github.event_name == 'workflow_dispatch' && inputs.build_ffpkg == true
    needs: [xcl, vkd3d-proton, innoextract, standalone]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install PS5 cross-build & Wine prefix toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 lld-18 llvm-18 \
            mingw-w64 bison flex pkg-config zlib1g-dev \
            wine64 wine zip unzip xz-utils

      - uses: actions/cache@v6
        with:
          path: |
            tools/dxvk
            tools/dxc
          key: deps-${{ hashFiles('pins.env') }}

      - name: Restore cached PS5 Wine server, prefix seed & opus.dll
        uses: actions/cache@v6
        with:
          path: .work/wine-cache
          key: wine-cache-v2-${{ hashFiles('pins.env', 'patches/prospero-win/0002-*', 'patches/prospero-win/0003-*', 'patches/prospero-win/0004-*', 'patches/prospero-win/0011-*', 'standalone/native/build_prefix_seed.py') }}

      - name: Fetch DXVK and DXC
        run: tools/fetch-deps.sh

      - uses: actions/download-artifact@v8
        with:
          name: xcl-release

      - uses: actions/download-artifact@v8
        with:
          name: innoextract
          path: innoextract

      - uses: actions/download-artifact@v8
        with:
          name: vkd3d-proton

      - name: Assemble XCL runtime & build PPSA83601.ffpkg
        run: |
          set -euo pipefail
          tools/make-ps5-package.sh
          bash tools/build-standalone-ffpkg.sh \
            --xcl-runtime dist/prospero-win/prefix/drive_c/XCL \
            --library-exe xcl/target/release/xcl.exe \
            --content-version 01.000.016 \
            --wine-cache .work/wine-cache \
            --output dist/ffpkg/PPSA83601.ffpkg
          (cd dist/ffpkg && zip -6 PPSA83601-ci.ffpkg.zip PPSA83601.ffpkg)
          rm -f dist/ffpkg/PPSA83601.ffpkg
          ls -lh dist/ffpkg/

      - uses: actions/upload-artifact@v7
        with:
          name: standalone-ffpkg-ci
          path: dist/ffpkg/PPSA83601-ci.ffpkg.zip
          if-no-files-found: error
