# Build and publish a complete GitHub Release (including standalone PPSA83601.ffpkg.zip)
# when pushing a v* tag or running manually.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.1)'
        required: true
        type: string
      prerelease:
        description: 'Mark as prerelease'
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  standalone:
    name: Standalone tests & prospero-win patches
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest standalone.test_standalone -v
      - run: bash -n tools/build-standalone-ffpkg.sh
      - name: Verify sce_sys/param.json contentVersion matches release tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          python3 - "$TAG" <<'PY'
          import json, re, sys
          from pathlib import Path
          tag = sys.argv[1]
          m = re.match(r"^v?(\d+)\.(\d+)\.(\d+)", tag)
          assert m, f"Release tag {tag!r} does not match vX.Y.Z"
          maj, minor, patch = (int(x) for x in m.groups())
          expected = f"{max(maj, 1):02d}.{minor:03d}.{patch:03d}"
          param = json.loads(Path("sce_sys/param.json").read_text(encoding="utf-8-sig"))
          actual = param.get("contentVersion")
          assert param.get("titleId") == "PPSA83601", f"unexpected titleId: {param.get('titleId')}"
          assert actual == expected, (
              f"sce_sys/param.json contentVersion={actual!r} does not match release tag {tag!r} (expected {expected!r}). "
              "Bump sce_sys/param.json before tagging!"
          )
          print(f"Release version guard OK: tag={tag} contentVersion={actual}")
          PY
      - name: Verify patches/prospero-win apply cleanly
        run: |
          set -euo pipefail
          . ./pins.env
          tmp=$(mktemp -d)
          git init -q "$tmp/pw"
          git -C "$tmp/pw" fetch -q --depth 1 "$PROSPERO_WIN_REPO" "$PROSPERO_WIN_REV"
          git -C "$tmp/pw" checkout -q FETCH_HEAD
          for p in patches/prospero-win/*.patch; do
            git -C "$tmp/pw" apply --whitespace=nowarn "$PWD/$p"
          done
          rm -rf "$tmp"

  xcl:
    name: Build XCL (release)
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7

      - name: Restore cached XCL output
        id: out
        uses: actions/cache@v6
        with:
          path: out
          key: xcl-out-v3-${{ hashFiles('pins.env', 'tools/setup-sources.sh', 'patches/xcl/**', 'library/**') }}

      - name: Fetch XCL and apply patches
        if: steps.out.outputs.cache-hit != 'true'
        shell: bash
        run: tools/setup-sources.sh --only xcl

      - name: Rust (stable, MSVC)
        if: steps.out.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        if: steps.out.outputs.cache-hit != 'true'
        with:
          workspaces: xcl -> target

      - name: Build & test
        if: steps.out.outputs.cache-hit != 'true'
        working-directory: xcl
        run: |
          cargo build --workspace --release
          cargo test --workspace --release -- --test-threads=4 --skip test_title_runs_

      - name: Collect outputs
        if: steps.out.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p out/xcl/target/release out/xcl/tests/data
          cp xcl/target/release/{xcl.exe,xcl_testtitle.exe,testgame_mw.dll} out/xcl/target/release/
          cp -r xcl/tests/data/testgame out/xcl/tests/data/
          cp xcl/LICENSE out/xcl/

      - uses: actions/upload-artifact@v7
        with:
          name: xcl-release
          path: out/
          if-no-files-found: error

  vkd3d-proton:
    name: Build vkd3d-proton (MSYS2 UCRT64)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7

      - name: Restore cached vkd3d-proton output
        id: out
        uses: actions/cache@v6
        with:
          path: out
          key: vkd3d-out-v2-${{ hashFiles('pins.env', 'tools/setup-sources.sh', 'patches/vkd3d-proton/**', 'patches/dxil-spirv/**') }}

      - name: Toolchain (MSYS2 UCRT64)
        if: steps.out.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          cache: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-glslang
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-tools

      - name: Fetch vkd3d-proton and apply patches
        if: steps.out.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: tools/setup-sources.sh --only vkd3d

      - name: Build (release, asserts off)
        if: steps.out.outputs.cache-hit != 'true'
        shell: msys2 {0}
        working-directory: vkd3d-proton
        run: |
          meson setup build-ndebug --buildtype release -Db_ndebug=true --strip
          ninja -C build-ndebug

      - name: Collect outputs
        if: steps.out.outputs.cache-hit != 'true'
        shell: bash
        run: |
          v=out/vkd3d-proton
          mkdir -p $v/build-ndebug/libs/d3d12 $v/build-ndebug/libs/d3d12core $v/subprojects/dxil-spirv
          cp vkd3d-proton/build-ndebug/libs/d3d12/d3d12.dll $v/build-ndebug/libs/d3d12/
          cp vkd3d-proton/build-ndebug/libs/d3d12core/d3d12core.dll $v/build-ndebug/libs/d3d12core/
          cp vkd3d-proton/LICENSE vkd3d-proton/COPYING $v/
          cp vkd3d-proton/subprojects/dxil-spirv/LICENSE.MIT $v/subprojects/dxil-spirv/

      - uses: actions/upload-artifact@v7
        with:
          name: vkd3d-proton
          path: out/
          if-no-files-found: error

  innoextract:
    name: Build trinity_innoextract.dll (MSYS2 UCRT64)
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7

      - name: Restore cached innoextract output
        id: out
        uses: actions/cache@v6
        with:
          path: out/innoextract
          key: innoextract-out-v1-${{ hashFiles('pins.env', 'tools/build-innoextract.sh', 'tools/innoextract/**') }}

      - name: Toolchain (MSYS2 UCRT64)
        if: steps.out.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          cache: true
          install: >-
            git
            python
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-xz

      - name: Build static trinity_innoextract.dll
        if: steps.out.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash tools/build-innoextract.sh

      - uses: actions/upload-artifact@v7
        with:
          name: innoextract
          path: out/innoextract
          if-no-files-found: error

  standalone-ffpkg:
    name: Build standalone PPSA83601.ffpkg
    needs: [xcl, vkd3d-proton, innoextract, standalone]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install PS5 cross-build & Wine prefix toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 lld-18 llvm-18 \
            mingw-w64 bison flex pkg-config zlib1g-dev \
            wine64 wine zip unzip xz-utils

      - uses: actions/cache@v6
        with:
          path: |
            tools/dxvk
            tools/dxc
          key: deps-${{ hashFiles('pins.env') }}

      - name: Restore cached PS5 Wine server, prefix seed & opus.dll
        uses: actions/cache@v6
        with:
          path: .work/wine-cache
          key: wine-cache-v2-${{ hashFiles('pins.env', 'patches/prospero-win/0002-*', 'patches/prospero-win/0003-*', 'patches/prospero-win/0004-*', 'patches/prospero-win/0011-*', 'standalone/native/build_prefix_seed.py') }}

      - name: Fetch DXVK and DXC
        run: tools/fetch-deps.sh

      - uses: actions/download-artifact@v8
        with:
          name: xcl-release

      - uses: actions/download-artifact@v8
        with:
          name: vkd3d-proton

      - uses: actions/download-artifact@v8
        with:
          name: innoextract
          path: innoextract

      - name: Assemble XCL runtime & build PPSA83601.ffpkg
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          CONTENT_VERSION=$(python3 - "$TAG" <<'PY'
          import re, sys
          m = re.match(r"^v?(\d+)\.(\d+)\.(\d+)", sys.argv[1])
          if m:
              maj, minor, patch = (int(x) for x in m.groups())
              print(f"{max(maj, 1):02d}.{minor:03d}.{patch:03d}")
          else:
              print("01.000.016")
          PY
          )
          echo "Building PPSA83601.ffpkg for ${TAG} (contentVersion=${CONTENT_VERSION})"
          tools/make-ps5-package.sh
          bash tools/build-standalone-ffpkg.sh \
            --xcl-runtime dist/prospero-win/prefix/drive_c/XCL \
            --library-exe xcl/target/release/xcl.exe \
            --content-version "$CONTENT_VERSION" \
            --wine-cache .work/wine-cache \
            --output dist/ffpkg/PPSA83601.ffpkg \
            --zip-output dist/ffpkg/PPSA83601.zip
          (cd dist/ffpkg && zip -6 "PPSA83601-${TAG}.ffpkg.zip" PPSA83601.ffpkg)
          rm -f dist/ffpkg/PPSA83601.ffpkg
          ls -lh dist/ffpkg/

      - uses: actions/upload-artifact@v7
        with:
          name: standalone-ffpkg
          path: |
            dist/ffpkg/PPSA83601.zip
            dist/ffpkg/PPSA83601-*.ffpkg.zip
          if-no-files-found: error

  publish:
    name: Assemble & publish GitHub Release
    needs: [xcl, vkd3d-proton, innoextract, standalone, standalone-ffpkg]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            tools/dxvk
            tools/dxc
          key: deps-${{ hashFiles('pins.env') }}

      - name: Fetch DXVK and DXC
        run: tools/fetch-deps.sh

      - uses: actions/download-artifact@v8
        with:
          name: xcl-release

      - uses: actions/download-artifact@v8
        with:
          name: vkd3d-proton

      - uses: actions/download-artifact@v8
        with:
          name: innoextract
          path: innoextract

      - uses: actions/download-artifact@v8
        with:
          name: standalone-ffpkg
          path: release-assets

      - name: Assemble release assets
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          tools/make-ps5-package.sh
          mkdir -p release-assets
          cp xcl/target/release/xcl.exe "release-assets/xcl-library-${TAG}.exe"
          (cd dist/prospero-win && zip -qr "../../release-assets/TrinityXSX-prospero-win-${TAG}.zip" .)
          (
            cd release-assets
            sha256sum "PPSA83601.zip" "PPSA83601-${TAG}.ffpkg.zip" "xcl-library-${TAG}.exe" "TrinityXSX-prospero-win-${TAG}.zip" > "SHA256SUMS-${TAG}.txt"
          )
          cat "release-assets/SHA256SUMS-${TAG}.txt"

      - name: Create or update GitHub Release (with retry)
        run: |
          set -euo pipefail
          . ./pins.env
          XCL_LAST=$(ls patches/xcl/[0-9][0-9][0-9][0-9]-*.patch | sort | tail -n 1 | xargs basename | cut -c1-4)
          PW_LAST=$(ls patches/prospero-win/[0-9][0-9][0-9][0-9]-*.patch | sort | tail -n 1 | xargs basename | cut -c1-4)
          cat > release-notes.md <<EOF
          ## What's new in TrinityXSX ${RELEASE_TAG}

          - **Unity / Mono PC & GOG Games Fix (`ntdll.prx` patch `0986` + PS5 DXVK 2.6.2 preservation):** Backported upstream `prospero-win` patch `0986` into our bundled `ntdll.prx` to stop 13,000+ faults/sec and multi-threaded crashes on Mono GC/JIT pages in Unity games (such as *Hollow Knight: Silksong*), and stopped PC handoff from overwriting `prospero-win`'s PS5-patched `DXVK v2.6.2-2-g1Queue` (`d3d11.dll`/`dxgi.dll`) in `system32`.
          - **Fast & Byte-Exact On-Console GOG Installer (`trinity_innoextract.dll`):** Replaced `boost::iostreams` file writes with direct Win32 `WriteFile` + close-time size verification, fixing Boost 1.88 4100-byte tail truncation and cutting PS5 write syscalls ~20x for noticeably faster installations.
          - **Cleaner, Jargon-Free UI:** Renamed `OPTIONS` menu to **Settings** with **Install GOG Games** promoted to the top row and highlighted right in the library header when installers are detected; removed internal technical jargon (`innoextract`, `MihawkGen`, `Vulkan/DXVK/D3D12`, `App/FG`) and added complete Polish translations across the Settings and GOG Installer screens.

          ### Included CI-built assets
          - \`PPSA83601.zip\` — standalone PS5 app folder (`PPSA83601/`) for ProsperoStore and `/data/homebrew/PPSA83601`.
          - \`PPSA83601-${RELEASE_TAG}.ffpkg.zip\` — standalone UFS2 image (`fsck_ufs` verified) for `/mnt/ext1/PPSA83601.ffpkg`.
          - \`xcl-library-${RELEASE_TAG}.exe\` — drop-in XCL library + runtime binary for `/data/homebrew/PPSA83601/prefix/drive_c/XCL/xcl-library.exe`.
          - \`TrinityXSX-prospero-win-${RELEASE_TAG}.zip\` — patched XCL + vkd3d-proton + DXVK + DXC runtime bundle.
          - \`SHA256SUMS-${RELEASE_TAG}.txt\` — SHA-256 checksums for all release assets.

          ### Pinned upstream revisions
          - **XCL:** \`${XCL_REV}\` (+ patches \`0001\`..\`${XCL_LAST}\`)
          - **vkd3d-proton:** \`${VKD3D_REV}\` (dxil-spirv \`${DXIL_SPIRV_REV}\`)
          - **DXVK:** \`v${DXVK_VERSION}\` · **DXC:** \`${DXC_TAG}\`
          - **prospero-win:** \`${PROSPERO_WIN_TAG}\` (\`${PROSPERO_WIN_REV}\` + patches \`0001\`..\`${PW_LAST}\`)
          - **PS5-Lapy-JB-Daemon:** \`${LAPY_REV}\`

          No games, keys, BIOS, or console SDK files are included.
          EOF

          publish_once() {
            if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
              gh release upload "${RELEASE_TAG}" release-assets/* --clobber
            else
              PRERELEASE_FLAG="--prerelease"
              if [ "${{ inputs.prerelease }}" = "false" ]; then
                PRERELEASE_FLAG=""
              fi
              gh release create "${RELEASE_TAG}" release-assets/* \
                --title "TrinityXSX ${RELEASE_TAG}" \
                --notes-file release-notes.md \
                $PRERELEASE_FLAG
            fi
          }

          for attempt in 1 2 3 4; do
            if publish_once; then
              exit 0
            fi
            delay=$((attempt * 15))
            echo "GitHub Release API attempt ${attempt} failed; retrying in ${delay}s..." >&2
            sleep "$delay"
          done
          echo "Failed to publish release ${RELEASE_TAG} after 4 attempts" >&2
          exit 1
