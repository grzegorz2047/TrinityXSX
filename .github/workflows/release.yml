# Build and stage a DRAFT GitHub Release (including standalone PPSA83601.ffpkg.zip)
# from a release/X.Y.Z branch. Tags do not trigger this workflow: publish the draft
# by hand after testing the built image on a PS5, and GitHub creates tag vX.Y.Z at
# the exact tested commit.
name: Release (draft)

on:
  push:
    branches:
      - 'release/*'
  workflow_dispatch:

permissions: {}

# One run per release branch at a time so two runs never create duplicate drafts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Version, metadata & release notes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      content_version: ${{ steps.meta.outputs.content_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Host tests (release guard, standalone & compatibility)
        run: |
          python3 -m unittest tools.test_release_guard -v
          python3 -m unittest standalone.test_standalone -v
          python3 tools/compat.py --check
          bash -n tools/build-standalone-ffpkg.sh

      - name: Validate version from release/X.Y.Z branch & repo metadata
        id: meta
        run: |
          set -euo pipefail
          VERSION=$(python3 -I tools/release_guard.py version --ref "$GITHUB_REF")
          CONTENT_VERSION=$(python3 -I tools/release_guard.py content-version --version "$VERSION")
          python3 -I tools/release_guard.py check-repo --version "$VERSION" --root .
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "content_version=$CONTENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Prepared draft release v$VERSION (contentVersion=$CONTENT_VERSION) from $GITHUB_SHA ($GITHUB_REF_NAME)"

      - name: Verify patches/prospero-win apply cleanly
        run: |
          set -euo pipefail
          . ./pins.env
          tmp=$(mktemp -d)
          git init -q "$tmp/pw"
          git -C "$tmp/pw" fetch -q --depth 1 "$PROSPERO_WIN_REPO" "$PROSPERO_WIN_REV"
          git -C "$tmp/pw" checkout -q FETCH_HEAD
          for p in patches/prospero-win/*.patch; do
            git -C "$tmp/pw" apply --whitespace=nowarn "$PWD/$p"
          done
          python3 tools/netinput-sender/make_page_c.py --check "$tmp/pw/src/pw_webinput_page.c"
          (cd "$tmp/pw" && for t in "tests/test_pw_netinput.c src/pw_netinput.c" \
               "tests/test_pw_webinput.c src/pw_webinput.c src/pw_webinput_page.c src/pw_netinput.c" \
               "-DPW_NETINPUT_PS5_HOST_TEST tests/test_pw_netinput_ps5.c native/pw_netinput_ps5.c src/pw_netinput.c" \
               "tests/test_pw_game_profile.c src/pw_game_profile.c src/pw_app_profile.c" \
               "tests/test_pw_game_menu.c src/pw_game_menu.c" \
               "tests/test_pw_launcher_render.c src/pw_launcher_render.c" \
               "tests/test_pw_toast.c src/pw_toast.c"; do
             cc -std=c11 -O1 -Wall -Wextra -Werror $t -o test && ./test; done)
          rm -rf "$tmp"

  xcl:
    name: Build XCL (release)
    needs: [prepare]
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Restore cached XCL output
        id: out
        uses: actions/cache@v6
        with:
          path: out
          key: xcl-out-v3-${{ hashFiles('pins.env', 'tools/setup-sources.sh', 'patches/xcl/**', 'library/**') }}

      - name: Fetch XCL and apply patches
        if: steps.out.outputs.cache-hit != 'true'
        shell: bash
        run: tools/setup-sources.sh --only xcl

      - name: Rust (stable, MSVC)
        if: steps.out.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        if: steps.out.outputs.cache-hit != 'true'
        with:
          workspaces: xcl -> target

      - name: Build & test
        if: steps.out.outputs.cache-hit != 'true'
        working-directory: xcl
        run: |
          cargo build --workspace --release
          cargo test --workspace --release -- --test-threads=4 --skip test_title_runs_

      - name: Collect outputs
        if: steps.out.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p out/xcl/target/release out/xcl/tests/data
          cp xcl/target/release/{xcl.exe,xcl_testtitle.exe,testgame_mw.dll} out/xcl/target/release/
          cp -r xcl/tests/data/testgame out/xcl/tests/data/
          cp xcl/LICENSE out/xcl/

      - uses: actions/upload-artifact@v7
        with:
          name: xcl-release
          path: out/
          if-no-files-found: error

  vkd3d-proton:
    name: Build vkd3d-proton (MSYS2 UCRT64)
    needs: [prepare]
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Restore cached vkd3d-proton output
        id: out
        uses: actions/cache@v6
        with:
          path: out
          key: vkd3d-out-v2-${{ hashFiles('pins.env', 'tools/setup-sources.sh', 'patches/vkd3d-proton/**', 'patches/dxil-spirv/**') }}

      - name: Toolchain (MSYS2 UCRT64)
        if: steps.out.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          cache: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-glslang
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-tools

      - name: Fetch vkd3d-proton and apply patches
        if: steps.out.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: tools/setup-sources.sh --only vkd3d

      - name: Build (release, asserts off)
        if: steps.out.outputs.cache-hit != 'true'
        shell: msys2 {0}
        working-directory: vkd3d-proton
        run: |
          meson setup build-ndebug --buildtype release -Db_ndebug=true --strip
          ninja -C build-ndebug

      - name: Collect outputs
        if: steps.out.outputs.cache-hit != 'true'
        shell: bash
        run: |
          v=out/vkd3d-proton
          mkdir -p $v/build-ndebug/libs/d3d12 $v/build-ndebug/libs/d3d12core $v/subprojects/dxil-spirv
          cp vkd3d-proton/build-ndebug/libs/d3d12/d3d12.dll $v/build-ndebug/libs/d3d12/
          cp vkd3d-proton/build-ndebug/libs/d3d12core/d3d12core.dll $v/build-ndebug/libs/d3d12core/
          cp vkd3d-proton/LICENSE vkd3d-proton/COPYING $v/
          cp vkd3d-proton/subprojects/dxil-spirv/LICENSE.MIT $v/subprojects/dxil-spirv/

      - uses: actions/upload-artifact@v7
        with:
          name: vkd3d-proton
          path: out/
          if-no-files-found: error

  innoextract:
    name: Build trinity_innoextract.dll (MSYS2 UCRT64)
    needs: [prepare]
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Restore cached innoextract output
        id: out
        uses: actions/cache@v6
        with:
          path: out/innoextract
          key: innoextract-out-v1-${{ hashFiles('pins.env', 'tools/build-innoextract.sh', 'tools/innoextract/**') }}

      - name: Toolchain (MSYS2 UCRT64)
        if: steps.out.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          cache: true
          install: >-
            git
            python
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-xz

      - name: Build static trinity_innoextract.dll
        if: steps.out.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash tools/build-innoextract.sh

      - uses: actions/upload-artifact@v7
        with:
          name: innoextract
          path: out/innoextract
          if-no-files-found: error

  netinput-sender:
    name: txin-sender.exe (keyboard & mouse over the LAN)
    needs: [prepare]
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Rust (stable, MSVC)
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Check, test & build
        working-directory: tools/netinput-sender
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo build --release

      - uses: actions/upload-artifact@v7
        with:
          name: txin-sender
          path: tools/netinput-sender/target/release/txin-sender.exe
          if-no-files-found: error

  standalone-ffpkg:
    name: Build standalone PPSA83601.ffpkg
    needs: [prepare, xcl, vkd3d-proton, innoextract]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install PS5 cross-build & Wine prefix toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 lld-18 llvm-18 \
            mingw-w64 bison flex pkg-config zlib1g-dev \
            wine64 wine zip unzip xz-utils

      - uses: actions/cache@v6
        with:
          path: |
            tools/dxvk
            tools/dxc
          key: deps-${{ hashFiles('pins.env') }}

      - name: Restore cached PS5 Wine server, prefix seed & opus.dll
        uses: actions/cache@v6
        with:
          path: .work/wine-cache
          key: wine-cache-v3-${{ hashFiles('pins.env', 'patches/prospero-win/0002-*', 'patches/prospero-win/0003-*', 'patches/prospero-win/0004-*', 'patches/prospero-win/0011-*', 'patches/prospero-win/0014-*', 'patches/prospero-win/0017-*', 'patches/prospero-win/0018-*', 'patches/prospero-win/0019-*', 'patches/prospero-win/0020-*', 'patches/prospero-win/0023-*', 'standalone/native/build_prefix_seed.py') }}

      - name: Fetch DXVK and DXC
        run: tools/fetch-deps.sh

      - uses: actions/download-artifact@v8
        with:
          name: xcl-release

      - uses: actions/download-artifact@v8
        with:
          name: vkd3d-proton

      - uses: actions/download-artifact@v8
        with:
          name: innoextract
          path: innoextract

      - name: Assemble XCL runtime & build PPSA83601.ffpkg
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          CONTENT_VERSION: ${{ needs.prepare.outputs.content_version }}
        run: |
          set -euo pipefail
          echo "Building PPSA83601.ffpkg for ${TAG} (contentVersion=${CONTENT_VERSION})"
          tools/make-ps5-package.sh
          bash tools/build-standalone-ffpkg.sh \
            --xcl-runtime dist/prospero-win/prefix/drive_c/XCL \
            --library-exe xcl/target/release/xcl.exe \
            --content-version "$CONTENT_VERSION" \
            --wine-cache .work/wine-cache \
            --output dist/ffpkg/PPSA83601.ffpkg \
            --zip-output dist/ffpkg/PPSA83601.zip
          python3 -I tools/release_guard.py check-zip-sce-sys \
            --zip dist/ffpkg/PPSA83601.zip \
            --sce-sys sce_sys
          (cd dist/ffpkg && zip -6 "PPSA83601-${TAG}.ffpkg.zip" PPSA83601.ffpkg)
          rm -f dist/ffpkg/PPSA83601.ffpkg
          ls -lh dist/ffpkg/

      - uses: actions/upload-artifact@v7
        with:
          name: standalone-ffpkg
          path: |
            dist/ffpkg/PPSA83601.zip
            dist/ffpkg/PPSA83601-*.ffpkg.zip
          if-no-files-found: error

  package:
    name: Assemble release files & SHA256SUMS.txt
    needs: [prepare, xcl, vkd3d-proton, innoextract, standalone-ffpkg, netinput-sender]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/cache@v6
        with:
          path: |
            tools/dxvk
            tools/dxc
          key: deps-${{ hashFiles('pins.env') }}

      - name: Fetch DXVK and DXC
        run: tools/fetch-deps.sh

      - uses: actions/download-artifact@v8
        with:
          name: xcl-release

      - uses: actions/download-artifact@v8
        with:
          name: vkd3d-proton

      - uses: actions/download-artifact@v8
        with:
          name: innoextract
          path: innoextract

      - uses: actions/download-artifact@v8
        with:
          name: standalone-ffpkg
          path: dist/release

      - uses: actions/download-artifact@v8
        with:
          name: txin-sender
          path: txin-sender

      - name: Collect flat release directory & hash every asset
        run: |
          set -euo pipefail
          tools/make-ps5-package.sh
          mkdir -p dist/release
          cp xcl/target/release/xcl.exe "dist/release/xcl-library-${TAG}.exe"
          cp txin-sender/txin-sender.exe "dist/release/txin-sender-${TAG}.exe"
          (cd dist/prospero-win && zip -qr "../../dist/release/TrinityXSX-prospero-win-${TAG}.zip" .)
          git archive --format=tar.gz --prefix="TrinityXSX-${TAG}/" \
            -o "dist/release/TrinityXSX-${TAG}-source.tar.gz" "$GITHUB_SHA"
          python3 -I tools/release_guard.py sums dist/release
          ls -lh dist/release/

      - uses: actions/upload-artifact@v7
        with:
          name: trinityxsx-${{ needs.prepare.outputs.version }}-release
          path: dist/release/
          if-no-files-found: error

  draft:
    name: Create or update draft GitHub Release
    needs: [prepare, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: trinityxsx-${{ needs.prepare.outputs.version }}-release
          path: dist/release

      - name: Verify every release file against SHA256SUMS.txt
        run: python3 -I tools/release_guard.py verify dist/release

      - name: Create or update draft release (never touches a published release)
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          guard() { python3 -I tools/release_guard.py "$@"; }
          view="$RUNNER_TEMP/release.json"

          decide() {
            local code=0
            gh release view "$TAG" --json tagName,isDraft,isImmutable,targetCommitish,assets \
              > "$view" 2> "$RUNNER_TEMP/release.err" || code=$?
            git -c credential.helper= -c credential.helper='!gh auth git-credential' \
              ls-remote --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" > "$RUNNER_TEMP/tags.txt" \
              || { echo "::error::git ls-remote --tags failed" >&2; return 1; }
            guard decide --tag "$TAG" --sha "$GITHUB_SHA" --view-exit "$code" \
              --view-stdout "$view" --view-stderr "$RUNNER_TEMP/release.err" \
              --remote-tag "$RUNNER_TEMP/tags.txt"
          }

          notes="docs/release-notes/${TAG}.md"
          title="TrinityXSX ${TAG}"
          action=$(decide)
          echo "Release ${TAG}: ${action}"

          if [[ $action == create ]]; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$title" \
              --notes-file "$notes" dist/release/*
          else
            # Never pass --draft on edit: a release published between checks must not be reverted.
            gh release edit "$TAG" --target "$GITHUB_SHA" --title "$title" --notes-file "$notes"
            [[ $(decide) == update ]]
            gh release upload "$TAG" dist/release/* --clobber
            [[ $(decide) == update ]]
            guard stale dist/release --view-stdout "$view" | while IFS= read -r name; do
              echo "::warning::draft $TAG still has asset $name, which this run did not upload"
            done
          fi

          gh release view "$TAG" --json isDraft,url,targetCommitish,assets \
            -q '"draft: \(.isDraft)  target: \(.targetCommitish)  assets: \(.assets | length)\n\(.url)"'

          {
            echo "### Draft release ${TAG} (${action})"
            echo
            echo "Commit \`${GITHUB_SHA}\`; verify on PS5, then publish the draft by hand (GitHub creates tag \`${TAG}\`)."
            echo
            echo '```'
            cat dist/release/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
