# Build and publish a GitHub Release when pushing a v* tag or running manually.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as prerelease'
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  standalone:
    name: Standalone tests & prospero-win patches
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest standalone.test_standalone -v
      - name: Verify patches/prospero-win apply cleanly
        run: |
          set -euo pipefail
          . ./pins.env
          tmp=$(mktemp -d)
          git init -q "$tmp/pw"
          git -C "$tmp/pw" fetch -q --depth 1 "$PROSPERO_WIN_REPO" "$PROSPERO_WIN_REV"
          git -C "$tmp/pw" checkout -q FETCH_HEAD
          for p in patches/prospero-win/*.patch; do
            git -C "$tmp/pw" apply --whitespace=nowarn "$PWD/$p"
          done
          rm -rf "$tmp"

  xcl:
    name: Build XCL (release)
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4

      - name: Restore cached XCL output
        id: out
        uses: actions/cache@v4
        with:
          path: out
          key: xcl-out-v2-${{ hashFiles('pins.env', 'tools/setup-sources.sh', 'patches/xcl/**') }}

      - name: Fetch XCL and apply patches
        if: steps.out.outputs.cache-hit != 'true'
        shell: bash
        run: tools/setup-sources.sh --only xcl

      - name: Rust (stable, MSVC)
        if: steps.out.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        if: steps.out.outputs.cache-hit != 'true'
        with:
          workspaces: xcl -> target

      - name: Build & test
        if: steps.out.outputs.cache-hit != 'true'
        working-directory: xcl
        run: |
          cargo build --workspace --release
          cargo test --workspace --release -- --test-threads=4 --skip test_title_runs_

      - name: Collect outputs
        if: steps.out.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p out/xcl/target/release out/xcl/tests/data
          cp xcl/target/release/{xcl.exe,xcl_testtitle.exe,testgame_mw.dll} out/xcl/target/release/
          cp -r xcl/tests/data/testgame out/xcl/tests/data/
          cp xcl/LICENSE out/xcl/

      - uses: actions/upload-artifact@v4
        with:
          name: xcl-release
          path: out/
          if-no-files-found: error

  vkd3d-proton:
    name: Build vkd3d-proton (MSYS2 UCRT64)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4

      - name: Restore cached vkd3d-proton output
        id: out
        uses: actions/cache@v4
        with:
          path: out
          key: vkd3d-out-v2-${{ hashFiles('pins.env', 'tools/setup-sources.sh', 'patches/vkd3d-proton/**', 'patches/dxil-spirv/**') }}

      - name: Toolchain (MSYS2 UCRT64)
        if: steps.out.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          cache: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-glslang
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-tools

      - name: Fetch vkd3d-proton and apply patches
        if: steps.out.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: tools/setup-sources.sh --only vkd3d

      - name: Build (release, asserts off)
        if: steps.out.outputs.cache-hit != 'true'
        shell: msys2 {0}
        working-directory: vkd3d-proton
        run: |
          meson setup build-ndebug --buildtype release -Db_ndebug=true --strip
          ninja -C build-ndebug

      - name: Collect outputs
        if: steps.out.outputs.cache-hit != 'true'
        shell: bash
        run: |
          v=out/vkd3d-proton
          mkdir -p $v/build-ndebug/libs/d3d12 $v/build-ndebug/libs/d3d12core $v/subprojects/dxil-spirv
          cp vkd3d-proton/build-ndebug/libs/d3d12/d3d12.dll $v/build-ndebug/libs/d3d12/
          cp vkd3d-proton/build-ndebug/libs/d3d12core/d3d12core.dll $v/build-ndebug/libs/d3d12core/
          cp vkd3d-proton/LICENSE vkd3d-proton/COPYING $v/
          cp vkd3d-proton/subprojects/dxil-spirv/LICENSE.MIT $v/subprojects/dxil-spirv/

      - uses: actions/upload-artifact@v4
        with:
          name: vkd3d-proton
          path: out/
          if-no-files-found: error

  publish:
    name: Assemble & publish GitHub Release
    needs: [xcl, vkd3d-proton, standalone]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            tools/dxvk
            tools/dxc
          key: deps-${{ hashFiles('pins.env') }}

      - name: Fetch DXVK and DXC
        run: tools/fetch-deps.sh

      - uses: actions/download-artifact@v4
        with:
          name: xcl-release

      - uses: actions/download-artifact@v4
        with:
          name: vkd3d-proton

      - name: Assemble release assets
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          tools/make-ps5-package.sh
          mkdir -p release-assets
          cp xcl/target/release/xcl.exe "release-assets/xcl-library-${TAG}.exe"
          (cd dist/prospero-win && zip -qr "../../release-assets/TrinityXSX-prospero-win-${TAG}.zip" .)
          (cd release-assets && sha256sum "xcl-library-${TAG}.exe" "TrinityXSX-prospero-win-${TAG}.zip" > "SHA256SUMS-${TAG}.txt")
          cat "release-assets/SHA256SUMS-${TAG}.txt"

      - name: Create or update GitHub Release
        run: |
          set -euo pipefail
          . ./pins.env
          cat > release-notes.md <<EOF
          ## TrinityXSX ${RELEASE_TAG}

          Experimental Xbox Series X|S (GDK) compatibility runtime and standalone PS5 home-screen library (\`PPSA83601\`).

          ### Included CI-built assets
          - \`xcl-library-${RELEASE_TAG}.exe\` — drop-in XCL library + runtime binary (multi-folder \`game_paths.txt\`, DualSense folder browser, Minecraft Preview controller/audio/save fixes). Copy to \`/data/homebrew/PPSA83601/prefix/drive_c/XCL/xcl-library.exe\` to update an existing standalone install.
          - \`TrinityXSX-prospero-win-${RELEASE_TAG}.zip\` — patched XCL + vkd3d-proton + DXVK + DXC runtime bundle with all third-party licenses.
          - \`SHA256SUMS-${RELEASE_TAG}.txt\` — SHA-256 checksums for CI-built assets.

          ### Pinned upstream revisions
          - **XCL:** \`${XCL_REV}\` (+ patches \`0001\`..\`0017\`)
          - **vkd3d-proton:** \`${VKD3D_REV}\` (dxil-spirv \`${DXIL_SPIRV_REV}\`)
          - **DXVK:** \`v${DXVK_VERSION}\`
          - **DXC:** \`${DXC_TAG}\`
          - **prospero-win:** \`${PROSPERO_WIN_TAG}\` (\`${PROSPERO_WIN_REV}\`)

          No games, keys, BIOS, or console SDK files are included.
          EOF

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release-assets/* --clobber
          else
            PRERELEASE_FLAG="--prerelease"
            if [ "${{ inputs.prerelease }}" = "false" ]; then
              PRERELEASE_FLAG=""
            fi
            gh release create "${RELEASE_TAG}" release-assets/* \
              --title "TrinityXSX ${RELEASE_TAG}" \
              --notes-file release-notes.md \
              $PRERELEASE_FLAG
          fi
